<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
 <linearGradient id="wvg" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity=".35"/><stop offset="1" stop-color="#b388ff" stop-opacity=".35"/></linearGradient>
 <linearGradient id="txt" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#b388ff"/></linearGradient>
</defs>
<style>
 .pt{opacity:0;animation:rise linear infinite}
 @keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-200px);opacity:0}}
 .st{animation:st 3s ease-in-out infinite}.s2{animation-delay:.8s}.s3{animation-delay:1.6s}
 @keyframes st{0%{opacity:0;transform:translateY(8px)}40%{opacity:.85}100%{opacity:0;transform:translateY(-10px)}}
 .cup{animation:cp 3s ease-in-out infinite}
 @keyframes cp{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
 .q{animation:qq 4s ease-in-out infinite}
 @keyframes qq{0%,100%{opacity:.7}50%{opacity:1}}
 .cur{animation:bl 1s steps(2) infinite}
 @keyframes bl{50%{opacity:0}}
 @keyframes wv{from{transform:translateX(0)}to{transform:translateX(-500px)}}
 text{font-family:'Courier New',Consolas,monospace}
</style>
