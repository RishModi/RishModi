<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="14" viewBox="0 0 1000 14" xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#b388ff"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient></defs>
<style>
.m1{animation:m1 4s ease-in-out infinite alternate}
.m2{animation:m2 6s ease-in-out infinite alternate}
@keyframes m1{from{transform:translateX(-100px)}to{transform:translateX(800px)}}
@keyframes m2{from{transform:translateX(800px)}to{transform:translateX(-100px)}}
.dia{transform-box:fill-box;transform-origin:center;animation:dp 2s ease-in-out infinite}
@keyframes dp{0%,100%{transform:rotate(45deg) scale(1);opacity:.6}50%{transform:rotate(225deg) scale(1.5);opacity:1}}
</style>
<rect y="6.5" width="1000" height="1" fill="#1f2a44"/>
<rect class="m1" y="5" width="300" height="4" rx="2" fill="url(#l)"/>
<rect class="m2" y="6" width="200" height="2" rx="1" fill="url(#l)" opacity=".7"/>
<rect class="dia" x="496" y="3" width="8" height="8" fill="#00e5ff"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>