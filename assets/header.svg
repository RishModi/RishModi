<text x="42" y="34" font-family="'Courier New',monospace" font-size="13" fill="#6e7f9e">status: ONLINE</text>
<text x="976" y="34" text-anchor="end" font-family="'Courier New',monospace" font-size="13" fill="#6e7f9e">learn | build | improve | repeat</text>
