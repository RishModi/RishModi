<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#0f1b3d"/></linearGradient>
 <linearGradient id="txt" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#b388ff"/></linearGradient>
 <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <linearGradient id="wvg" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity=".35"/><stop offset="1" stop-color="#b388ff" stop-opacity=".35"/></linearGradient>
 <linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff" stop-opacity=".5"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient>
 <radialGradient id="g1"><stop offset="0" stop-color="#00e5ff" stop-opacity=".5"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="g2"><stop offset="0" stop-color="#b388ff" stop-opacity=".5"/><stop offset="1" stop-color="#b388ff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00e5ff" stroke-opacity=".07"/></pattern>
 <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
 <clipPath id="nm"><text x="500" y="135" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="5">RISHI MODI</text></clipPath>
</defs>
<style>
 .o1{animation:a 9s ease-in-out infinite alternate}
 .o2{animation:b 11s ease-in-out infinite alternate}
 @keyframes a{from{transform:translate(0,0)}to{transform:translate(220px,40px)}}
 @keyframes b{from{transform:translate(0,0)}to{transform:translate(-240px,-30px)}}
 .grid{animation:gr 3s linear infinite}
 @keyframes gr{from{transform:translateY(0)}to{transform:translateY(40px)}}
 .pt{opacity:0;animation:rise linear infinite}
 @keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-300px);opacity:0}}
 .scan{animation:sc 6s ease-in-out infinite}
 @keyframes sc{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(300px);opacity:0}}
 .ring{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}
 .ring2{animation-direction:reverse;animation-duration:30s}
 @keyframes spin{to{transform:rotate(360deg)}}
 .glow{animation:gl 3s ease-in-out infinite}
 @keyframes gl{0%,100%{opacity:.25}50%{opacity:.7}}
 .shine{animation:sh 5s ease-in-out infinite}
 @keyframes sh{0%{transform:translateX(0)}60%,100%{transform:translateX(1150px)}}
 .name{opacity:0;animation:in 1.2s .3s ease-out forwards}
 .sub{opacity:0;animation:in 1.2s .9s ease-out forwards}
 .tag{opacity:0;animation:in 1.2s 1.5s ease-out forwards}
 @keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
 .blink{animation:bl 1.2s steps(2) infinite}
 @keyframes bl{50%{opacity:0}}
 @keyframes wv{from{transform:translateX(0)}to{transform:translateX(-500px)}}
</style>
